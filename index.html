    <script>
      // Suppress benign Vite HMR WebSocket & cross-origin Script errors in sandbox iframe environment
      (function() {
        const isBenignMsg = function(msg) {
          if (!msg) return false;
          const s = String(msg && msg.message ? msg.message : msg);
          return (
            s === 'Script error.' ||
            s === 'Script error' ||
            s.includes('Script error') ||
            s.includes('WebSocket') ||
            s.includes('closed without opened') ||
            s.includes('@vite/client') ||
            s.includes('ws://') ||
            s.includes('wss://') ||
            s.includes('vite:ws')
          );
        };

        window.addEventListener('error', function(e) {
          if (e && (isBenignMsg(e.message) || (e.error && isBenignMsg(e.error)) || (e.filename && isBenignMsg(e.filename)))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.onerror = function(msg, url, line, col, error) {
          if (isBenignMsg(msg) || isBenignMsg(url)) {
            return true;
          }
        };

        window.addEventListener('unhandledrejection', function(e) {
          if (e && (isBenignMsg(e.reason) || (e.reason && isBenignMsg(e.reason.message)))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        // Intercept native WebSocket to cleanly handle Vite HMR in iframe
        if (typeof window.WebSocket !== 'undefined') {
          const OrigWebSocket = window.WebSocket;

          class ViteHMRMockSocket extends EventTarget {
            constructor(url, protocols) {
              super();
              this.url = String(url || '');
              this.protocols = protocols;
              this.readyState = 0; // CONNECTING
              this.binaryType = 'blob';
              this.bufferedAmount = 0;
              this.extensions = '';
              this.protocol = Array.isArray(protocols) ? protocols[0] || 'vite-hmr' : (protocols || 'vite-hmr');
              this.onopen = null;
              this.onclose = null;
              this.onerror = null;
              this.onmessage = null;

              setTimeout(() => {
                this.readyState = 1; // OPEN
                const evt = new Event('open');
                if (typeof this.onopen === 'function') {
                  try { this.onopen(evt); } catch (_) {}
                }
                this.dispatchEvent(evt);
              }, 10);
            }

            send() {}

            close(code, reason) {
              this.readyState = 3; // CLOSED
              const evt = new CloseEvent('close', { wasClean: true, code: code || 1000, reason: reason || '' });
              if (typeof this.onclose === 'function') {
                try { this.onclose(evt); } catch (_) {}
              }
              this.dispatchEvent(evt);
            }
          }

          ViteHMRMockSocket.prototype.CONNECTING = 0;
          ViteHMRMockSocket.prototype.OPEN = 1;
          ViteHMRMockSocket.prototype.CLOSING = 2;
          ViteHMRMockSocket.prototype.CLOSED = 3;

          ViteHMRMockSocket.CONNECTING = 0;
          ViteHMRMockSocket.OPEN = 1;
          ViteHMRMockSocket.CLOSING = 2;
          ViteHMRMockSocket.CLOSED = 3;

          window.WebSocket = function(url, protocols) {
            const isViteHMR =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/?token=')));

            if (isViteHMR) {
              return new ViteHMRMockSocket(url, protocols);
            }

            const ws = protocols ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
            ws.addEventListener('error', function(err) {
              if (typeof err === 'object') {
                try { err.stopImmediatePropagation?.(); } catch (_) {}
              }
            });
            return ws;
          };

          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }

        const isWsMsg = isBenignMsg;
        const origConsoleError = console.error;
        console.error = function() {
          try {
            const args = Array.from(arguments);
            const hasWs = args.some(function(arg) {
              return isBenignMsg(arg) || (arg && isBenignMsg(arg.message)) || (arg && isBenignMsg(arg.stack));
            });
            if (hasWs) return;
          } catch (_) {}
          origConsoleError.apply(console, arguments);
        };
      })();

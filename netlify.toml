[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["vite", "@vitejs/plugin-react", "@tailwindcss/vite", "lightningcss", "sharp"]
  included_files = ["data/**", "firebase-applet-config.json"]

# Route API endpoints directly to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# Route SPA pages to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
